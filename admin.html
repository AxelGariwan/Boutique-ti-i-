<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Administration - Boutique ti i</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>[x-cloak]{display:none!important}body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}</style>
</head>
<body class="h-full text-slate-800 antialiased" x-data="admin()" x-cloak>

<!-- Connexion -->
<div x-show="ready&&!ok" class="min-h-full grid place-items-center p-4">
 <form @submit.prevent="login()" class="bg-white border border-slate-200 rounded-2xl p-6 w-full max-w-sm space-y-3 shadow-sm">
  <h1 class="font-bold text-lg">Administration</h1>
  <p class="text-xs text-slate-500">Réservé à l’administrateur de la plateforme.</p>
  <input type="email" x-model="f.email" placeholder="Email" autocomplete="email" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
  <input type="password" x-model="f.password" placeholder="Mot de passe" autocomplete="current-password" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
  <p x-show="err" class="text-red-600 text-xs" x-text="err"></p>
  <button :disabled="busy" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-2.5 rounded-lg text-sm" x-text="busy?'Connexion…':'Se connecter'"></button>
 </form>
</div>

<!-- Tableau de bord -->
<div x-show="ok" class="max-w-7xl mx-auto p-4 sm:p-6 space-y-5">
 <div class="flex items-center justify-between gap-3">
  <h1 class="font-bold text-xl">Administration — Boutique ti i</h1>
  <div class="flex gap-3 text-sm">
   <button class="underline text-emerald-700" @click="reload()">Actualiser</button>
   <button class="underline text-red-600" @click="logout()">Déconnexion</button>
  </div>
 </div>

 <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
  <div class="bg-white border rounded-xl p-3"><p class="text-xs text-slate-500">Vendeurs</p><p class="text-2xl font-bold" x-text="vendors.length"></p></div>
  <div class="bg-white border rounded-xl p-3"><p class="text-xs text-slate-500">Pièces à vérifier</p><p class="text-2xl font-bold text-amber-600" x-text="count('pending')"></p></div>
  <div class="bg-white border rounded-xl p-3"><p class="text-xs text-slate-500">Vendeurs validés</p><p class="text-2xl font-bold text-emerald-700" x-text="count('approved')"></p></div>
  <div class="bg-white border rounded-xl p-3"><p class="text-xs text-slate-500">Commandes</p><p class="text-2xl font-bold" x-text="orders.length"></p></div>
 </div>

 <div class="flex gap-2 text-sm">
  <button @click="tab='vendors'" :class="tab==='vendors'?'bg-slate-900 text-white':'bg-white border'" class="px-3 py-1.5 rounded-lg">Vendeurs et boutiques</button>
  <button @click="tab='orders'" :class="tab==='orders'?'bg-slate-900 text-white':'bg-white border'" class="px-3 py-1.5 rounded-lg">Commandes</button>
 </div>

 <!-- Vendeurs -->
 <div x-show="tab==='vendors'" class="space-y-3">
  <div class="flex flex-wrap gap-2 items-center">
   <select x-model="filter" class="border border-slate-300 rounded-lg px-2 py-1.5 text-sm bg-white">
    <option value="all">Tous</option><option value="pending">À vérifier</option><option value="approved">Validés</option><option value="rejected">Refusés</option>
   </select>
   <input x-model="q" placeholder="Rechercher (nom, email, boutique, pays…)" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm flex-1 min-w-[200px] bg-white">
  </div>
  <div class="bg-white border rounded-xl overflow-x-auto">
   <table class="w-full text-sm">
    <thead class="bg-slate-50 text-xs text-slate-500 text-left">
     <tr><th class="p-3">Boutique</th><th class="p-3">Vendeur</th><th class="p-3">Pays</th><th class="p-3">Identité</th><th class="p-3">Inscrit le</th><th class="p-3">Actions</th></tr>
    </thead>
    <tbody>
     <template x-for="v in list" :key="v.id">
      <tr class="border-t align-top">
       <td class="p-3">
        <b x-text="shopName(v)"></b>
        <p class="text-xs text-slate-500" x-text="productsOf(v)+' article(s)'"></p>
        <a x-show="shopOf(v)" :href="shopLink(v)" target="_blank" rel="noopener" class="text-xs text-emerald-700 underline">Voir la boutique</a>
        <span x-show="shopOf(v)&&shopOf(v).suspended" class="ml-1 text-xs bg-red-100 text-red-700 px-1.5 py-0.5 rounded-full font-bold">SUSPENDUE</span>
       </td>
       <td class="p-3"><p x-text="v.full_name"></p><p class="text-xs text-slate-500" x-text="v.email"></p><p class="text-xs text-slate-500" x-text="v.phone"></p></td>
       <td class="p-3" x-text="v.country"></td>
       <td class="p-3">
        <span class="text-xs font-bold px-2 py-0.5 rounded-full" :class="v.id_status==='approved'?'bg-emerald-100 text-emerald-700':(v.id_status==='rejected'?'bg-red-100 text-red-700':'bg-amber-100 text-amber-700')" x-text="v.id_status==='approved'?'Validée':(v.id_status==='rejected'?'Refusée':(v.id_doc_path?'À vérifier':'Pièce manquante'))"></span>
        <p x-show="v.id_status==='rejected'&&v.id_reject_reason" class="text-xs text-slate-500 mt-1" x-text="v.id_reject_reason"></p>
       </td>
       <td class="p-3 text-xs" x-text="new Date(v.created_at).toLocaleDateString('fr-FR')"></td>
       <td class="p-3 space-y-1 text-xs">
        <button x-show="v.id_doc_path" class="block underline text-slate-700" @click="viewDoc(v)">Voir la pièce</button>
        <button x-show="v.id_doc_path&&v.id_status!=='approved'" class="block underline text-emerald-700 font-bold" @click="approve(v)">Valider</button>
        <button x-show="v.id_doc_path&&v.id_status!=='rejected'" class="block underline text-red-600" @click="reject(v)">Refuser</button>
        <button x-show="shopOf(v)" class="block underline text-slate-700" @click="toggleSuspend(v)" x-text="shopOf(v)&&shopOf(v).suspended?'Réactiver la boutique':'Suspendre la boutique'"></button>
       </td>
      </tr>
     </template>
    </tbody>
   </table>
   <p x-show="!list.length" class="p-4 text-sm text-slate-500">Aucun vendeur.</p>
  </div>
 </div>

 <!-- Commandes -->
 <div x-show="tab==='orders'" class="bg-white border rounded-xl overflow-x-auto">
  <table class="w-full text-sm">
   <thead class="bg-slate-50 text-xs text-slate-500 text-left">
    <tr><th class="p-3">Date</th><th class="p-3">Boutique</th><th class="p-3">Réf.</th><th class="p-3">Client</th><th class="p-3">Total</th><th class="p-3">Paiement</th><th class="p-3">Statut</th></tr>
   </thead>
   <tbody>
    <template x-for="o in orders" :key="o.id">
     <tr class="border-t">
      <td class="p-3 text-xs" x-text="new Date(o.created_at).toLocaleString('fr-FR')"></td>
      <td class="p-3" x-text="shopNameById(o.shop_id)"></td>
      <td class="p-3" x-text="o.ref"></td>
      <td class="p-3"><p x-text="o.customer_name"></p><p class="text-xs text-slate-500" x-text="o.customer_phone"></p></td>
      <td class="p-3" x-text="o.total"></td>
      <td class="p-3 text-xs" x-text="o.pay_mode"></td>
      <td class="p-3 text-xs" x-text="o.status"></td>
     </tr>
    </template>
   </tbody>
  </table>
  <p x-show="!orders.length" class="p-4 text-sm text-slate-500">Aucune commande.</p>
 </div>
</div>

<script src="config.js"></script>
<script>
var db = supabase.createClient(SB_URL, SB_KEY);
function admin() {
  return {
    ready: false, ok: false, busy: false, err: "", tab: "vendors", filter: "all", q: "",
    f: { email: "", password: "" }, vendors: [], shops: [], orders: [],

    init: async function () {
      var s = await db.auth.getSession();
      if (s.data.session) await this.check(s.data.session.user.id);
      this.ready = true;
    },
    login: async function () {
      this.err = ""; this.busy = true;
      var r = await db.auth.signInWithPassword({ email: this.f.email.trim().toLowerCase(), password: this.f.password });
      this.busy = false;
      if (r.error) { this.err = "Email ou mot de passe incorrect."; return; }
      this.f.password = "";
      await this.check(r.data.user.id);
    },
    // Seuls les comptes listés dans la table "admins" peuvent entrer
    check: async function (uid) {
      var r = await db.from("admins").select("user_id").eq("user_id", uid).maybeSingle();
      if (!r.data) { this.err = "Ce compte n’a pas les droits administrateur."; await db.auth.signOut(); this.ok = false; return; }
      this.ok = true; await this.reload();
    },
    logout: async function () { await db.auth.signOut(); this.ok = false; this.vendors = []; this.shops = []; this.orders = []; },
    reload: async function () {
      var a = await db.from("vendors").select("*").order("created_at", { ascending: false });
      var b = await db.from("shops").select("id,owner,suspended,updated_at,data");
      var c = await db.from("orders").select("*").order("created_at", { ascending: false }).limit(300);
      if (a.data) this.vendors = a.data;
      if (b.data) this.shops = b.data;
      if (c.data) this.orders = c.data;
    },
    count: function (st) { return this.vendors.filter(function (v) { return v.id_status === st && v.id_doc_path; }).length; },
    get list() {
      var q = this.q.trim().toLowerCase(), self = this, f = this.filter;
      return this.vendors.filter(function (v) {
        if (f === "pending" && !(v.id_status === "pending")) return false;
        if (f !== "all" && f !== "pending" && v.id_status !== f) return false;
        if (!q) return true;
        return [v.full_name, v.email, v.phone, v.country, self.shopName(v)].join(" ").toLowerCase().indexOf(q) >= 0;
      });
    },
    shopOf: function (v) { return this.shops.find(function (s) { return s.owner === v.id; }); },
    shopName: function (v) { var s = this.shopOf(v); return (s && s.data && s.data.name) || v.shop_name || "—"; },
    shopNameById: function (id) { var s = this.shops.find(function (x) { return x.id === id; }); return (s && s.data && s.data.name) || id; },
    productsOf: function (v) { var s = this.shopOf(v); return s && s.data && s.data.products ? s.data.products.length : 0; },
    shopLink: function (v) { var s = this.shopOf(v); return s ? location.origin + location.pathname.replace(/admin\.html$/, "") + "?b=" + s.id : "#"; },

    viewDoc: async function (v) {
      var w = window.open("", "_blank");
      var r = await db.storage.from("id-docs").createSignedUrl(v.id_doc_path, 120);
      if (r.error) { if (w) w.close(); alert("Impossible d’ouvrir la pièce : " + r.error.message); return; }
      if (w) w.location = r.data.signedUrl; else window.open(r.data.signedUrl, "_blank");
    },
    setStatus: async function (v, patch) {
      var r = await db.from("vendors").update(patch).eq("id", v.id);
      if (r.error) { alert("Erreur : " + r.error.message); return; }
      Object.assign(v, patch);
    },
    approve: async function (v) {
      if (!confirm("Valider l’identité de " + v.full_name + " ? Sa boutique deviendra visible des clients.")) return;
      var auth = await db.auth.getUser();
      if (auth.error || !auth.data.user) { alert("Session administrateur expirée. Reconnectez-vous."); return; }
      await this.setStatus(v, {
        id_status: "approved",
        id_reject_reason: null,
        id_verified_at: new Date().toISOString(),
        id_verified_by: auth.data.user.id
      });
    },
    reject: async function (v) {
      var why = prompt("Motif du refus (affiché au vendeur) :", "Pièce illisible ou non valide");
      if (why === null) return;
      var auth = await db.auth.getUser();
      if (auth.error || !auth.data.user) { alert("Session administrateur expirée. Reconnectez-vous."); return; }
      await this.setStatus(v, {
        id_status: "rejected",
        id_reject_reason: why.trim() || "Pièce non valide",
        id_verified_at: null,
        id_verified_by: null
      });
    },
    toggleSuspend: async function (v) {
      var s = this.shopOf(v); if (!s) return;
      var to = !s.suspended;
      if (!confirm((to ? "Suspendre" : "Réactiver") + " la boutique de " + v.full_name + " ?")) return;
      var r = await db.from("shops").update({ suspended: to }).eq("id", s.id);
      if (r.error) { alert("Erreur : " + r.error.message); return; }
      s.suspended = to;
    }
  };
}
</script>
</body>
</html>
